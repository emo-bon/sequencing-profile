name: Update Tag and Trigger Crate Workflows

on:
  push:
    branches:
      - main

jobs:
  update-tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for full git history/tags

      - name: Setup Git for pushing tags
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Fetch latest SemVer tag and bump based on commit message
        id: bump
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Fetch all tags
          git fetch --tags

          # Get list of all tags
          TAGS=$(git tag -l)

          # SemVer regex (from your snippet)
          regex="^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[0-9a-zA-Z-]*))*))?(\\+([0-9a-zA-Z-]+(\\.[0-9a-zA-Z-]+)*))?$"

          # Filter valid SemVer tags
          VALID_TAGS=""
          for tag in $TAGS; do
            if [[ $tag =~ $regex ]]; then
              VALID_TAGS="$VALID_TAGS $tag"
            fi
          done

          # Get commit message and trim whitespace
          COMMIT_MSG=$(echo "$COMMIT_MESSAGE" | xargs)
          echo "Commit message: '$COMMIT_MSG'"

          # Determine bump type
          if [[ $COMMIT_MSG == major* ]]; then
            BUMP_TYPE="major"
          elif [[ $COMMIT_MSG == minor* ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
          echo "Bump type: $BUMP_TYPE"

          # Find the latest valid SemVer tag and bump accordingly
          if [ -z "$VALID_TAGS" ]; then
            if [ "$BUMP_TYPE" = "major" ]; then
              NEW_TAG="1.0.0"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              NEW_TAG="0.1.0"
            else
              NEW_TAG="0.0.1"
            fi
          else
            LATEST_TAG=$(echo "$VALID_TAGS" | tr ' ' '\n' | sort -V | tail -n1)
            # Extract core versions (ignore pre-release/build)
            CORE_TAG=$(echo $LATEST_TAG | cut -d- -f1 | cut -d+ -f1)
            MAJOR=$(echo $CORE_TAG | cut -d. -f1)
            MINOR=$(echo $CORE_TAG | cut -d. -f2)
            PATCH=$(echo $CORE_TAG | cut -d. -f3)

            if [ "$BUMP_TYPE" = "major" ]; then
              NEW_MAJOR=$((MAJOR + 1))
              NEW_TAG="$NEW_MAJOR.0.0"
            elif [ "$BUMP_TYPE" = "minor" ]; then
              NEW_MINOR=$((MINOR + 1))
              NEW_TAG="$MAJOR.$NEW_MINOR.0"
            else
              NEW_PATCH=$((PATCH + 1))
              NEW_TAG="$MAJOR.$MINOR.$NEW_PATCH"
            fi
          fi

          echo "Bumping to new tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          # Create and push the new tag using PAT for auth
          git tag $NEW_TAG
          git push https://x-access-token:${{ secrets.DISPATCH_TOKEN }}@github.com/${{ github.repository }}.git $NEW_TAG
  trigger-crates:
    runs-on: ubuntu-latest
    steps:
      - name: List and filter crate repositories
        id: list-repos
        run: |
          REPOS_JSON=$(curl -s -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/orgs/emo-bon/repos?per_page=100)
          
          CRATE_REPOS=$(echo "$REPOS_JSON" | jq -r '.[].name | select(endswith("-crate"))')
          
          echo "crate_repos=$CRATE_REPOS" >> $GITHUB_OUTPUT

      - name: Trigger workflows in crate repos
        run: |
          for REPO in ${{ steps.list-repos.outputs.crate_repos }}; do
            echo "Triggering workflow in $REPO"
            curl -s -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -X POST \
              https://api.github.com/repos/emo-bon/$REPO/actions/workflows/workflows.yml/dispatches \
              -d '{"ref":"main"}'
          done